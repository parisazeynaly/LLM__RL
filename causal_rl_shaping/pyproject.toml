[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-rl-shaping"
version = "0.1.0"
authors = [
  { name="Parisa Zeinaliashtiyani" }
]
description = "Potential-Based Causal Reward Shaping for LLM Red-Teaming"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20.0"
]

[project.urls]
"Homepage" = "https://github.com/parisaze/CausalRLBreaker"
"Live Demo" = "https://huggingface.co/spaces/parisaze/Reward"
